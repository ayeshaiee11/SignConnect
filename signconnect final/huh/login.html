<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Signup</title>
<link rel="stylesheet" href="login.css">
</head>

<body>

<div id="bubbles-container"></div>

<!-- LOGIN -->
<div id="login-form" class="form-container">
<div class="form-card">

<h1>Log in</h1>

<form id="loginForm">

<div class="input-group">
<input type="text" name="username" placeholder="Username" class="form-input">
</div>

<div class="input-group">
<input type="password" name="password" id="login-password" placeholder="Password" class="form-input">

<button type="button" class="toggle-password" onclick="togglePassword('login-password', this)">
👁
</button>
</div>

<button type="submit" class="btn-primary">Log in</button>

<div class="form-footer">
or
<button type="button" class="link-underline" onclick="switchToSignup()">Sign up</button>
</div>

</form>

</div>
</div>


<!-- SIGNUP -->
<div id="signup-form" class="form-container" style="display:none;">
<div class="form-card">

<h1>Sign up</h1>

<form id="signupForm">

<div class="input-group">
<input type="text" name="username" placeholder="Username" class="form-input">
</div>

<div class="input-group">
<input type="email" name="email" placeholder="Email" class="form-input">
</div>

<div class="input-group">
<input type="password" name="password" id="signup-password" placeholder="Password" class="form-input">
<button type="button" class="toggle-password" onclick="togglePassword('signup-password', this)">👁</button>
</div>

<div class="input-group">
<input type="password" name="confirmPassword" id="confirm-password" placeholder="Confirm Password" class="form-input">
<button type="button" class="toggle-password" onclick="togglePassword('confirm-password', this)">👁</button>
</div>

<button type="submit" class="btn-primary">Sign up</button>

<div class="form-footer">
Already have account?
<button type="button" class="link-underline" onclick="switchToLogin()">Log in</button>
</div>

</form>

</div>
</div>

<script src="login.js"></script>

</body>
</html>
